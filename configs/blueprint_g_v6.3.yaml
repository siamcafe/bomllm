execution_plan:
  status: "PLANNED_NOT_EXECUTED"
  owner_approval_required: true
  ordered_steps:
    - order: 1
      action: "Review this live evidence and approve one bounded staging change window"
      dependencies: "None"
      gate: "Owner selects fix 1 first; no production change is implicit in this blueprint"
    - order: 2
      action: "Apply fix 1 valves only and run explicit-off/greeting/music/explicit-on regression tests"
      dependencies: "Step 1 and backed-up valves"
      gate: "Stop if readback differs or any explicit-on search is lost"
    - order: 3
      action: "Run fix 2 staging fanout measurements; optionally evaluate fix 3 snippet-only profile after search behavior is safe"
      dependencies: "Step 2 and matched baseline corpus"
      gate: "No timeout increase and no AM4 backend enablement without measurements and a secure C2-reachable bind"
    - order: 4
      action: "Implement and test music source/original-prompt/busy/tempo repairs; enable autoroute only after playable-audio acceptance"
      dependencies: "Fix 1 verified and i9 capacity reviewed"
      gate: "No autoroute while the busy probe fails or RAM/VRAM is below the owner-approved floor"
    - order: 5
      action: "Repair overlay metadata/common postprocessing and perform visual stock/attached/PuLID/n=2 acceptance"
      dependencies: "Approved owner integration patch window"
      gate: "Stop on missing original-image rollback or ambiguous duplicate-job behavior"
    - order: 6
      action: "Resolve i9 workload ownership and capacity before heavier music/image concurrency"
      dependencies: "Owning lane and owner decision"
      gate: "No bare kill and no duplicate ComfyUI_GPU1 service start"
    - order: 7
      action: "Clean approved AM4 aliases, reconcile router persistence, and recover LiteLLM provenance/drain documentation"
      dependencies: "Owner route/profile decisions and staging rehearsal evidence"
      gate: "Protected production services and locked params remain invariant"
  final_acceptance:
    - "All changes read back with exact before/after evidence and rollback receipts"
    - "No production change is inferred from this survey artifact"
    - "All seven locked params remain exact and presence_penalty remains 0.0"
    - "Remaining unmeasured items are reported as unmeasured, not converted into passes"

