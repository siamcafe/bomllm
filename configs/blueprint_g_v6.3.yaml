      - step: "POST /api/v1/functions/id/force_web_search_global/valves/update with JSON {\"respect_explicit_off\":true,\"excluded_model_ids\":\"deep-think-pipe,bom-vision,bom-thai-think,qwen38-chat,music_yue2.music-yue2\"}"
        target: "C2:function force_web_search_global; preserves the existing exclusion list and adds only the music pipe"
      - step: "Read back valves and test four bodies: explicit-off chat, greeting fast-pass, music pipe, and explicit-on search"
        target: "C2:extension-level regression test; no core OWUI source edit"
    validation: "Explicit-off and greeting remain web_search=false with no sources; music pipe receives no forced retrieval; explicit-on still searches; image_generation remains excluded"
    rollback: "Restore the backed-up valves through the same endpoint; prior effective behavior is respect_explicit_off=false and the original four-entry exclusion list"
  fix_2_embedding_deadline_and_fanout:
    priority: CRITICAL
    problem: "Unlimited single-item fanout can exceed the 30-second proxy boundary; C2 is the only working enabled backend"
    root_cause: "batch_size=1, concurrency=0, async gather, full-page retrieval, and 30-second client/server timeouts; AM4 Tailscale address is not reachable from C2"
    fix_steps:
      - step: "Save GET /api/v1/retrieval/embedding and /api/v1/retrieval/config responses plus /home/bom/rag-lb/haproxy.cfg to a timestamped backup before any future change"
        target: "C2:read-only backup in the approved future execution window"
      - step: "In staging only, POST /api/v1/retrieval/embedding/update with the complete current engine/model/openai fields plus RAG_EMBEDDING_BATCH_SIZE=8, RAG_EMBEDDING_CONCURRENT_REQUESTS=2, ENABLE_ASYNC_EMBEDDING=true"
        target: "Staging:do not omit openai_config or required fields from EmbeddingModelUpdateForm"
      - step: "Run a bounded matched-page corpus with explicit attempt cap and cooldown; record per-stage p50/p95, queue depth, failures, and orphaned work. Do not raise HAProxy timeout unless backend p95 and end-to-end budgets justify it"
        target: "Staging:one hypothesis per round; candidate proxy timeout is 60s only after measurement"
      - step: "Do not enable the AM4 HAProxy server until an owner-approved secure listener/proxy path makes 100.80.16.53:7997 reachable from C2 without exposing an unprotected embedding API"
        target: "AM4/C2:network design gate; current C2 probe is HTTP 000"
    validation: "No disconnects across the matched corpus; bounded concurrency=2 is observed; response budgets remain below the proxy deadline; document RAG still works independently of snippet-only web search"
    rollback: "Restore engine/model/batch=1/concurrency=0/async=true and the backed-up HAProxy file through tmp+cp and the approved existing deployment path; no C2 docker compose"
  fix_3_snippet_only_search_profile:
    priority: IMPORTANT
    problem: "Every forced search loads full pages and embeds/retrieves them even when only snippets are needed"
    root_cause: "web.search.bypass_web_loader=false and web.search.bypass_embedding_and_retrieval=false with result_count=3"
    fix_steps:
      - step: "After fix 1 and staging evidence, POST /api/v1/retrieval/config/update with JSON {\"web\":{\"WEB_SEARCH_RESULT_COUNT\":2,\"BYPASS_WEB_SEARCH_WEB_LOADER\":true,\"BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL\":true}}"
        target: "C2:persisted web-search ConfigVars; ENABLE_PERSISTENT_CONFIG=true"
      - step: "Read back both API and PostgreSQL values and compare identical forced-search prompts before/after"
        target: "C2:verify no unrelated keys, model profiles, or locked params changed"
    validation: "Responses include retrievable source evidence without embed/store failure; record that snippets may omit numeric details; do not claim a universal token target"
    rollback: "POST the original values result_count=3 and both bypass flags=false; read back again"
  fix_4_music_pipeline:
    priority: CRITICAL
    problem: "Music autoroute is off, web context can inflate parser input, EDM ignores requested tempo, and busy check fails open on an unreachable port"
    root_cause: "Disabled intent valve, last_user_text on enriched body, fixed electronic=122 BPM parser, and hardcoded Tailscale IP:8188 busy URL"
    fix_steps:
      - step: "Apply and verify fix 1 first so music_yue2.music-yue2 never receives forced web/RAG context"
        target: "C2:dependency gate"
      - step: "Create a new reviewed music pipe/extension version that consumes metadata.base_user_prompt with an original-message fallback, uses http://desktop-g3mkh6j.tailf5814f.ts.net:18188/queue, and makes busy-probe failure visible for explicit music requests"
        target: "C2:function music_yue2 and bom_intent_filter through extension version history; no upstream OWUI core edit"
      - step: "Parse an explicit BPM with bounds 60-200, preserve genre/energy qualifiers, use candidate EDM default 140 only when no BPM is supplied, and pass BPM through the selected workflow; use numeric bpm and language=th only for TextEncodeAceStepAudio1.5"
        target: "C2:music parser/style assembly; prompting alone is not proof of measured output tempo"
      - step: "Keep enable_music_intent=false until explicit 10-second playable-audio generation, no-sources, original-prompt, busy-gate, and queue-drain tests pass; only then enable autoroute for bom-thai-chat"
        target: "C2:owner-approved staged activation"
    validation: "Generic EDM reaches the intended pipe, explicit music returns playable audio, HTTP 200 is not treated as functional success by itself, no unrelated job is cancelled, and measured tempo is reported with half/double-time uncertainty"
    rollback: "Set enable_music_intent=false and restore the previous function versions/valves; do not retry an ambiguous submitted ComfyUI job automatically"
  fix_5_image_overlay:
    priority: IMPORTANT
    problem: "Overlay metadata is absent or consumed on several successful image paths"
    root_cause: "Attached-image and PuLID early returns bypass the common stock hook; direct calls lack chat metadata; GETDEL is single-use"
    fix_steps:
      - step: "Refactor only the existing maintained owner overlay/integration path so every successful stock, attached-image, and PuLID result reaches one postprocessor before upload; do not change upstream OWUI release files"
        target: "C2:bom_intent_filter stash logic and existing thai_overlay hook at images.py PuLID return and stock upload branches"
      - step: "Pass explicit overlay metadata instead of relying only on chat_id+GETDEL; make n>1 consumption per-image and idempotent, and preserve fail-open original bytes on renderer errors"
        target: "C2:utils/thai_overlay.py and extension metadata contract; bind-mounted files use tmp+cp, never sed -i"
      - step: "Add per-attempt exception handling that distinguishes rejection before submission from ambiguous accepted jobs before trying another direct URL"
        target: "C2:existing image integration direct-URL loop; avoid duplicate generation"
    validation: "Visually inspect actual stock, attached-image, PuLID, and n=2 images with quoted Thai captions; verify coordinates/object evidence where applicable and test direct API metadata"
    rollback: "Restore the previous owner hook and extension versions from timestamped backups; original images remain available because rendering fails open"
  fix_6_i9_capacity_and_ownership:
    priority: CRITICAL
    problem: "i9 RAM is below 1 GiB available and GPU1 has only 397 MiB free; two PowerShell processes dominate RAM"
    root_cause: "Two large encoded-launcher PowerShell workloads plus shared GPU1 consumers; exact workload ownership is unresolved"
    fix_steps:
      - step: "Give the owning lane the recorded PID, parent PID, creation time, and working-set evidence; revalidate current exact PID and command line before any owner-approved action"
        target: "i9:cross-lane review only; no bare kill and no action from this survey"
      - step: "Stop or reduce the owning workload only through its own runbook after owner approval; do not start ComfyUI_GPU1 NSSM while PID 48216 or its current successor owns :8190"
        target: "i9:owner and owning-lane gate"
      - step: "Define owner-approved RAM/VRAM admission floors before heavier concurrent jobs; keep YuE2, ComfyUI, llama-server, and VoxCPM capacity accounting separate"
        target: "i9:future capacity policy, not an invented threshold in this survey"
    validation: "Available RAM and GPU1 headroom exceed the approved floors, queues remain bounded, and exactly one intended listener owns each ComfyUI port"
    rollback: "If an owning workload is paused under its runbook, resume only through that same runbook; no survey rollback is required because no state was changed"
  fix_7_am4_stale_routes:
    priority: IMPORTANT
    problem: "Seven stale aliases point to unreachable ports or MeTube"
    root_cause: "Legacy model_list destinations remain after backend roles changed"
    fix_steps:
      - step: "Backup /data/migrated/litellm/config.yaml and obtain owner disposition for fast, batch, classify, creative, t1-9b-gpu, t3a-27b-cpu, and t3c-lfm-cpu before removal or retargeting"
        target: "AM4:owner route inventory; preserve thai_prod"
      - step: "Apply only the approved route diff via tmp+cp and the existing drained deployment runbook"
        target: "AM4:no protected UA model, Mac owner gateway, or C2 config change"
    validation: "Model inventory contains only intended aliases and thai_prod still returns HTTP 200; no stale destination is reported healthy"
    rollback: "Restore the backed-up config through the same approved runbook"
  fix_8_router_persistence:
    priority: IMPORTANT
    problem: "AM4 admin_override weights differ from saved market/weekend profiles and would not survive restart"
    root_cause: "Runtime override is in memory while saved profiles retain i9 2/2"
    fix_steps:
      - step: "Owner confirms intended active profile and i9 market/weekend policy; capture /workers before any change"
        target: "AM4:comfy-router admin API; key loaded without printing"
      - step: "Reconcile or deliberately persist the override only through the router's supported admin path after staging a restart-persistence test"
        target: "AM4:no router restart in this survey and no blind override clear"
    validation: "Active and saved weights match the approved policy after rehearsal, C2 stock image behavior remains documented as router-disabled"
    rollback: "Restore the captured prior weights through the supported admin API"
  fix_9_provenance_and_drain_records:
    priority: IMPORTANT
    problem: "Custom LiteLLM provenance is incomplete and old drain-gap text conflicts with current enable_drain_endpoint=true"
    root_cause: "Custom pil2 builds have divergent IDs and documentation was not updated when drain configuration changed"
    fix_steps:
      - step: "Record Dockerfiles, patch hashes, base registry digest, variant, platform, and signatures for C2 and AM4 custom images; keep package 1.106.4 pinned"
        target: "C2/AM4:evidence recovery only; no image replacement"
      - step: "Update operational records to show drain configured on C2, UA prod/staging, and AM4, but keep the rehearsal gate open until an authorized staging drain proves readiness and in-flight semantics"
        target: "Documentation first; no mutating drain call in this task"
    validation: "Exact variant signature/provenance is reviewed and a future authorized staging drain has evidence; no claim based solely on tag or digest prefix"
    rollback: "Keep current running images and configuration; documentation corrections do not alter runtime"

