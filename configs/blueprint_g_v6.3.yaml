  - "CAT (122.155.168.7) — NEVER TOUCH except bomai.app/public_html/"
  - "AM4 /data/migrated/agent-hub — LIVE PRODUCTION HUB"
  - "n8n on NAS — NEVER restart/upgrade (OWNER HOLD)"
  - "docker compose on C2 — NEVER (docker run with flags only)"
  - "presence_penalty MUST be 0.0 (1.5 = Han leak); the observed Han=3 sample proves 0.0 is not a general language guarantee, not permission to change it"
