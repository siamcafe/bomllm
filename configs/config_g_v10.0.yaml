changes_from_v8:
- '1. OWUI target version: v0.12.5 -> v0.13.0 (release 2026-11-03, commit c38885a). Live at survey: v0.12.5, image 03443b8de6b6,
  WEBUI_BUILD_HASH f7ac7ee. Primary driver: unpublished upstream security fixes (''update as soon as possible'').'
- '2. Ollama target versions: Mac 0.40.10 -> 0.40.14, UA 0.40.13 -> 0.40.14 (commit 9a3e81777672). Live at survey unchanged.
  AM4 Ollama 0.40.13 is NOT in this upgrade''s scope (spec covers UA then Mac only).'
- '3. New env vars documented: ENABLE_COMMENTS=false (new, upstream default false, keep off); ENABLE_NOTIFICATIONS=false (new,
  upstream default TRUE — pin false to keep the inbox off); USER_PERMISSIONS_CHAT_SIDE_CHAT=false (new, upstream default false);
  KNOWLEDGE_MAX_FILE_COUNT / KNOWLEDGE_MAX_FILE_SIZE / KNOWLEDGE_MAX_UPLOAD_COUNT (new, default unset=None = no cap).'
- '4. Default change pinned: CHAT_RESPONSE_MAX_TOOL_CALL_ITERATIONS=256 (old default; new upstream default 1024). Legacy CHAT_RESPONSE_MAX_TOOL_CALL_RETRIES
  is still read as a fallback. C2 sets neither today.'
- '5. Drift fix queued: LiteLLM bomai-safe extra_body repeat_penalty 1.05 -> 1.0 to match GOD CONFIG. UA bomai-safe Modelfile
  verified live at repeat_penalty 1.0 — the drift is in the LiteLLM route, not the model.'
- '6. Alembic version: 0bd252b206fb -> e42c8f710a36 via 3 new migrations (c41f8d9e2a10, 6f8c2a91d4e7, e42c8f710a36). Linear
  chain, each file has downgrade(). Rolling two versions at once is unsupported.'
- '7. New tables: comment, comment_reaction, notification; new column tool.is_active (boolean, default true). function, model,
  chat, config and user tables are NOT altered. None of the 18 live function rows is affected.'
- '8. Sub-agent caps documented: SUBAGENTS_MAX_CONCURRENT / SUBAGENTS_MAX_ASYNC / SUBAGENTS_MAX_ITERATIONS / SUBAGENTS_MAX_OUTPUT
  upstream defaults changed from 20/20/30/30000 to empty (unlimited). ENABLE_SUBAGENTS stays false (default, unset on C2),
  so the uncapped limits stay latent.'
- '9. Ollama v0.40.14 sampler fix documented: /v1 chat/completions endpoints no longer force temperature 1.0 / top_p 1.0 when
  the client omits them — Modelfile defaults now apply. NO fleet impact: the fleet chain is OWUI -> LiteLLM ollama_chat ->
  Ollama /api/chat, which already used Modelfile defaults; no model_list api_base points at an Ollama /v1 URL.'
- '10. MLX top-k improvement documented for Mac: chunked selection for vocabularies above 2048 when k < 2048 (mlx/topk.go,
  mlxrunner/sample/sample.go). Applies to Mac qwen38-uni (mlx runner); no published speed figure. UA llamacpp models do not
  get this path.'
- '11. Live function-hash drift observed at 2026-11-03 re-survey (informational; no action taken): music_yue2 md5 49c63f742c6c6132869908df374e6fc8
  -> 1dfc29042539a09e0d2dc895f80a15d7 (22960 -> 24961 bytes); bom_intent_filter md5 b6484d803eeba9fe1c2ef805e49ec4b2 -> bd079a60e0dd908133874947425c7a94
  (44387 -> 45623 bytes). Context: art#55630 — the art55602 valve write is gone from function meta, and the ffmpeg 60s transcode
  cap is confirmed hardcoded in transcode(). The live 2026-11-03 hashes are the v9 baseline (see function_hash_baseline).'
- '12. BOMAI shared-instance coverage added: banner, custom buttons and branding inventory with a v0.13.0 risk check (Controls
  move, tabbed workspace, notifications) — see machines.c2.open_webui.bomai_ui. Verdict: no code edit identified for BOMAI
  UI functions; patched index.html/apikey-button.js/keys.html are version-coupled (MEDIUM) and must be rebased; visual QC
  on BOTH BOMLLM and BOMAI surfaces is the gate.'
