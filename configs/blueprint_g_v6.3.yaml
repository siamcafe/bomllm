problems_verified:
  sluggishness:
    codex_finding: "Full OWUI gold request took 63.942 seconds; direct C2 LiteLLM tests took 1.405-6.454 seconds; forced web search and a 30-second embedding disconnect were implicated"
    live_verified: true
    verification_scope: "The avoidable-work mechanism is verified; the exact historical full-OWUI latency and disconnect were not reproduced"
    evidence: |
      force_web_search_global is active/global; source default priority=999, respect_explicit_off=False, and stored valves do not override either default.
      web.search.result_count=3; bypass_web_loader=false; bypass_embedding_and_retrieval=false; web.search.concurrent_requests=0.
      HAProxy: connect=3s, client=30s, server=30s; AM4 server disabled; only C2 local Infinity remains.
      Current direct short chat: HTTP 200 in 3.571000s. Current HAProxy single embedding: HTTP 200 in 5.042574s.
    root_cause: "Forced late search plus full-page loading and unbounded single-item embedding fanout remains a verified source of avoidable latency. The contribution to the historical 63.942-second request is not re-quantified; admission active=0 and queue=0 do not indicate queue delay in this snapshot"
  brief_answers:
    codex_finding: "Production answers were suspected of being brief; locked parameters and direct response lengths needed verification"
    live_verified: false
    evidence: "Mac direct request produced 3 paragraphs, 1320 characters, eval_count=404, done_reason=stop. C2 detailed route produced 3 paragraphs, 1017 characters, completion=232, finish=stop. C2 short prompt produced 52 tokens, consistent with its short-answer instruction"
    root_cause: "Not reproduced. No evidence supports changing the seven locked parameters to address brevity"
  image_overlay:
    codex_finding: "Thai overlay exists but direct API, attached-image, PuLID, and multi-image paths are unreliable"
    live_verified: true
    verification_scope: "Live deployed source and runtime prerequisites; no rendered-image claim"
    evidence: |
      bom_intent_filter returns attached-image turns before the overlay stash at its later image-generation block.
      images.py successful PuLID branch uploads and returns before the stock maybe_apply hook.
      Stock generation calls maybe_apply before upload. thai_overlay.maybe_apply requires chat_id and uses Redis GETDEL, consuming one spec for n>1.
      Direct URL loop has no per-attempt exception handler around comfyui_create_image.
      Font /app/backend/data/fonts/IBMPlexSansThai-Bold.ttf exists; runtime raqm=True.
      image_generation.model=DreamShaper_8_pruned.safetensors, size=512x512, steps=20; AM4 inventories DreamShaper and flux1-dev-fp8; images.edit.enable=false; COMFY_ROUTER_ENABLED=False.
    root_cause: "Confirmed metadata/early-return design gaps and consumable side channel, not a missing font or RAQM capability. Runtime caption spelling remains unverified"
  music_edm:
    codex_finding: "Generic EDM stayed on chat, explicit YuE2 failed text-length validation, autoroute was off, EDM mapped to 122 BPM, and busy gate used the wrong endpoint"
    live_verified: true
    verification_scope: "Current routing defaults, source, valves, parser, and endpoint behavior verified; historical application-level failures and audio quality were not regenerated"
    evidence: |
      Stored bom_intent_filter valves contain only target_models=bom-thai-chat,bom-glm12b. Filter loader constructs Valves(**stored_values); source default enable_music_intent=False.
      music_yue2 ENABLED=true, MAX_DURATION_S=30, MAX_CALLS_PER_DAY=5, LOCAL_TIMEOUT_S=600.
      parse_request rejects empty or >8000-character input. Middleware stores metadata.base_user_prompt before source enrichment, but the pipe consumes last_user_text(body), not that original field.
      electronic preset = melodic deep house, 122 BPM; parser extracts duration/seed/lyrics/genre and has no explicit BPM or energy propagation.
      Intent busy check uses http://100.85.255.14:8188/queue and fails open. C2 probe there returned HTTP 000 after 5.049508s.
      Exact configured YuE2 hostname returned /queue HTTP 200 in 0.084499s with empty queues.
    root_cause: "Confirmed routing disabled, original-message/context-boundary mismatch, fixed genre tempo mapping, and unreachable fail-open busy probe. The precise historical post-filter text length and actual audio BPM remain unmeasured"
  embedding:
    codex_finding: "Embedding disconnected after 30.429 seconds under full-page web retrieval; batch_size=1 and unlimited concurrency targeted the sole C2 CPU backend behind a 30-second proxy"
    live_verified: false
    configuration_risk_verified: true
    evidence: |
      Direct C2 Infinity embedding: HTTP 200, 768 dimensions, prompt_tokens=25, time=2.000976s.
      HAProxy embedding: HTTP 200, 768 dimensions, prompt_tokens=23, time=5.042574s.
      rag.embedding_batch_size=1; rag.embedding_concurrent_requests=0; rag.enable_async_embedding=true; deployed source treats concurrency 0 as no semaphore.
      HAProxy client/server=30s; AM4 backend disabled; C2 local backend is marked backup but is the only enabled server.
      C2 to AM4 Tailscale embedding probe: HTTP 000 in 0.099796s. AM4 LAN health itself is HTTP 200.
    root_cause: "No timeout was reproduced by bounded single requests, so the precise disconnect origin remains unproven. The fanout/deadline mismatch and C2-only working route are verified; enabling AM4 requires a separate secure bind/reachability design"
  am4_stale_routes:
    codex_finding: "Seven of eight AM4 LiteLLM aliases were stale; thai_prod was the remaining working route"
    live_verified: true
    evidence: "Eight aliases advertised. Ports 8000 and 8080 unreachable; port 8082 is MeTube and /v1/models returns 404. thai_prod returned HTTP 200 in 0.872779s"
    root_cause: "Confirmed stale destination inventory; these aliases are not on the demonstrated C2 default-chat path"
